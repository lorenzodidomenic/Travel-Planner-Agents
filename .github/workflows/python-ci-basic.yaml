name: Python CI

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install workspace (all packages + dev)
        run: uv sync --frozen --all-packages

      - name: Smoke test
        run: uv run python -c "import travel_common, flight_agent, hotel_agent, itinerary_agent, orchestrator_agent, fastapi"
