name: Python CI

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. Installa uv (gestisce anche la cache in modo automatico)
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'

    # 2. Installa le dipendenze con uv (usando --system per l'ambiente globale del runner)
    - name: Install dependencies
      run: |
        uv pip install --system -r pyproject.toml 